apiVersion: v1
kind: Service
metadata:
  name: knative-grafana-nodeport
  namespace: observability
  labels:
    app.kubernetes.io/part-of: auto-claimer-demo
spec:
  type: NodePort
  selector:
    app.kubernetes.io/instance: knative
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 3000
      nodePort: 30300
---
apiVersion: v1
kind: Service
metadata:
  name: knative-prometheus-nodeport
  namespace: observability
  labels:
    app.kubernetes.io/part-of: auto-claimer-demo
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: prometheus
    operator.prometheus.io/name: knative-kube-prometheus-st-prometheus
  ports:
    - name: http-web
      protocol: TCP
      port: 9090
      targetPort: 9090
      nodePort: 30909
