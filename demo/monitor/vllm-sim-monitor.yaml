apiVersion: v1
kind: Service
metadata:
  name: vllm-sim-metrics
  namespace: default
  labels:
    app.kubernetes.io/name: vllm-sim
    app.kubernetes.io/part-of: auto-claimer-demo
spec:
  selector:
    deploy-type: vllm-sim-with-dra
  ports:
    - name: metrics
      protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vllm-sim-metrics
  namespace: observability
  labels:
    release: knative
    app.kubernetes.io/part-of: auto-claimer-demo
spec:
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm-sim
      app.kubernetes.io/part-of: auto-claimer-demo
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
