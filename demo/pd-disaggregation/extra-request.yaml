apiVersion: apps/v1
kind: Deployment
metadata:
  name: extra-vllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: extra-vllm
  template:
    metadata:
      labels:
        app: extra-vllm
    spec:
      containers:
      - args:
        - --model
        - ibm-granite/granite-speech-3.3-2b
        - --port
        - "8000"
        - --max-loras
        - "2"
        - --lora-modules
        - '{"name": "food-review-1"}'
        image: ghcr.io/llm-d/llm-d-inference-sim:latest
        imagePullPolicy: IfNotPresent
        name: vllm-sim
        env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: metadata.namespace
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        resources:
          claims:
          - name: shared-gpu
      resourceClaims:
      - name: shared-gpu
        resourceClaimTemplateName: llm-d-decode-granite
