apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "llm-d-inference-sim.fullname" . }}
  labels:
    {{- include "llm-d-inference-sim.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "llm-d-inference-sim.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print .Template.BasePath "/configmap.yaml") . | sha256sum }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "llm-d-inference-sim.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
      # UDS Tokenizer sidecar - handles tokenization via gRPC over Unix Domain Socket
      # restartPolicy: Always makes this a native sidecar (K8s 1.29+):
      # the simulator will not start until this container's readinessProbe passes
      - name: uds-tokenizer
        image: {{ .Values.udsTokenizer.image }}
        imagePullPolicy: {{ .Values.udsTokenizer.imagePullPolicy }}
        restartPolicy: Always
        env:
        - name: LOG_LEVEL
          value: {{ .Values.udsTokenizer.logLevel | quote }}
        - name: PROBE_PORT
          value: {{ .Values.udsTokenizer.probePort | quote }}
        ports:
        - name: health
          containerPort: {{ .Values.udsTokenizer.probePort }}
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.udsTokenizer.probePort }}
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.udsTokenizer.probePort }}
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: uds-socket
          mountPath: /tmp/tokenizer
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config
            - /config/config.yaml
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          resources:
            {{- include "llm-d-inference-sim.podResources" . | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: uds-socket
              mountPath: /tmp/tokenizer
      volumes:
        - name: config
          configMap:
            name: {{ include "llm-d-inference-sim.fullname" . }}-config
        # Shared volume for Unix Domain Socket communication between the simulator and UDS tokenizer
        - name: uds-socket
          emptyDir: {}
      {{- with .Values.dra.enabled }}
      resourceClaims:
        {{- range $.Values.dra.claims }}
        - name: {{ .name }}
          resourceClaimName: {{ include "llm-d-inference-sim.fullname" $ }}-{{ .name }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
