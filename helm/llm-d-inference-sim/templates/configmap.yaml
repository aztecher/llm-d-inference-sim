apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "llm-d-inference-sim.fullname" . }}-config
  labels:
    {{- include "llm-d-inference-sim.labels" . | nindent 4 }}
data:
  config.yaml: |
    port: {{ .Values.config.port }}
    model: "{{ .Values.config.model }}"
    served-model-name:
    {{- toYaml .Values.config.servedModelName | nindent 4 }}
    max-loras: {{ .Values.config.maxLoras }}
    max-cpu-loras: {{ .Values.config.maxCpuLoras }}
    max-num-seqs: {{ .Values.config.maxNumSeqs }}
    max-model-len: {{ .Values.config.maxModelLen }}
    lora-modules:
    {{- toYaml .Values.config.loraModules | nindent 4 }}
    mode: "{{ .Values.config.mode }}"
    time-to-first-token: {{ .Values.config.timeToFirstToken }}
    inter-token-latency: {{ .Values.config.interTokenLatency }}
    kv-cache-transfer-latency: {{ .Values.config.kvCacheTransferLatency }}
    seed: {{ .Values.config.seed }}
    # Latency Configuration (realistic for 8B model)
    latency-calculator: {{ .Values.config.latencyCalculator }}
    prefill-overhead: {{ .Values.config.prefillOverhead }}
    prefill-time-per-token: {{ .Values.config.prefillTimePerToken }}
    prefill-time-std-dev: {{ .Values.config.prefillTimeStdDev }}
    time-factor-under-load: {{ .Values.config.timeFactorUnderLoad }}
    # KV Cache Simulation
    enable-kvcache: {{ .Values.config.enableKvcache }}
    kv-cache-size: {{ .Values.config.kvCacheSize }}
    block-size: {{ .Values.config.blockSize }}
    global-cache-hit-threshold: {{ .Values.config.globalCacheHitThreshold }}
